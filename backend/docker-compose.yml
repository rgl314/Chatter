services:
  mysql:
    image: mysql:8.0
    container_name: mysql_chatter
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatter
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - chatter-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    container_name: keycloak_chatter
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - chatter-network
    command:
      - "start-dev"

networks:
  chatter-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
